<!-- Weekly Availability Calendar — expects `calendar_events_json` and `calendar_items_json` in context.
     Renders a unified table: item metadata + 7 day columns.
-->
<div class="select-none">
  <!-- Controls -->
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-base font-semibold text-slate-900">Equipment Items & Availability</h3>
    <div class="flex items-center gap-2">
      <button id="wk-prev"
              class="p-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <span id="wk-label" class="text-sm font-semibold text-slate-700 w-48 text-center"></span>
      <button id="wk-next"
              class="p-1.5 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-slate-700 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Legend -->
  <div class="flex flex-wrap gap-4 mb-4 text-xs text-slate-500">
    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded bg-emerald-100 border border-emerald-300"></span>Active</span>
    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded bg-brand-100 border border-brand-300"></span>Confirmed</span>
    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded bg-orange-100 border border-orange-300"></span>Return Pending</span>
    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded bg-auburn-bluePale border border-auburn-bluePale"></span>Pending</span>
    <span class="flex items-center gap-1.5"><span class="inline-block w-3 h-3 rounded bg-white border border-slate-200"></span>Available</span>
  </div>

  <!-- Calendar grid -->
  <div class="overflow-x-auto">
    <div id="wk-grid" class="min-w-[900px]"></div>
  </div>

  <!-- Detail panel -->
  <div id="wk-detail" class="hidden mt-3 p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs text-slate-700"></div>
</div>

<script id="calendar-events-data" type="application/json">{{ calendar_events_json|safe }}</script>
<script id="calendar-items-data" type="application/json">{{ calendar_items_json|safe }}</script>
<script>
(function () {
  const raw = document.getElementById('calendar-events-data');
  if (!raw) return;
  let events;
  try { events = JSON.parse(raw.textContent); } catch(e) { events = []; }

  const itemsRaw = document.getElementById('calendar-items-data');
  let items = [];
  if (itemsRaw) {
    try { items = JSON.parse(itemsRaw.textContent); } catch(e) {}
  }

  let weekStart = new Date();
  const dow = weekStart.getDay();
  const offset = dow === 0 ? -6 : 1 - dow;
  weekStart.setDate(weekStart.getDate() + offset);
  weekStart.setHours(0, 0, 0, 0);

  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function toIso(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  function eventsForDay(iso) {
    return events.filter(e => e.start <= iso && e.end >= iso);
  }

  function cellClass(status) {
    if (status === 'ACTIVE')         return 'bg-emerald-100 border-emerald-300 text-emerald-800';
    if (status === 'RETURN_PENDING') return 'bg-orange-100 border-orange-300 text-orange-800';
    if (status === 'CONFIRMED')      return 'bg-brand-100 border-brand-300 text-brand-800';
    if (status === 'PENDING')        return 'bg-auburn-bluePale border-auburn-bluePale text-brand-800';
    return 'bg-white border-slate-200 text-slate-400';
  }

  function dotColor(status) {
    if (status === 'AVAILABLE') return 'bg-green-400';
    if (status === 'BORROWED')  return 'bg-yellow-400';
    return 'bg-red-400';
  }

  function render() {
    const grid = document.getElementById('wk-grid');
    const detail = document.getElementById('wk-detail');
    grid.innerHTML = '';
    detail.className = 'hidden mt-3 p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs text-slate-700';

    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(weekStart);
      d.setDate(d.getDate() + i);
      days.push(d);
    }

    // Update label
    const endDay = days[6];
    const label = weekStart.getFullYear() === endDay.getFullYear()
      ? `${MONTH_NAMES[weekStart.getMonth()]} ${weekStart.getDate()} – ${MONTH_NAMES[endDay.getMonth()]} ${endDay.getDate()}, ${endDay.getFullYear()}`
      : `${MONTH_NAMES[weekStart.getMonth()]} ${weekStart.getDate()}, ${weekStart.getFullYear()} – ${MONTH_NAMES[endDay.getMonth()]} ${endDay.getDate()}, ${endDay.getFullYear()}`;
    document.getElementById('wk-label').textContent = label;

    // Header row
    const headerRow = document.createElement('div');
    headerRow.className = 'grid grid-cols-[180px_100px_90px_120px_40px_repeat(7,1fr)] gap-1 mb-1';
    const headers = ['Item','Location','Condition','Owner','','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    headers.forEach((h, i) => {
      const cell = document.createElement('div');
      cell.className = 'text-xs font-semibold text-slate-500 py-2 px-1' + (i < 5 ? ' text-left' : ' text-center');
      if (i >= 5) {
        const d = days[i - 5];
        cell.innerHTML = `${h}<br><span class="text-[10px] text-slate-400 font-normal">${MONTH_NAMES[d.getMonth()]} ${d.getDate()}</span>`;
      } else {
        cell.textContent = h;
      }
      headerRow.appendChild(cell);
    });
    grid.appendChild(headerRow);

    // Item rows
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'grid grid-cols-[180px_100px_90px_120px_40px_repeat(7,1fr)] gap-1 mb-1';

      // Item name
      const nameCell = document.createElement('div');
      nameCell.className = 'text-xs font-medium text-slate-700 py-2 px-1 truncate flex items-center';
      nameCell.title = item.name;
      nameCell.innerHTML = `<a href="/equipment/${item.pk}/" class="hover:text-brand-600 transition">${item.name}</a>`;
      row.appendChild(nameCell);

      // Location
      const locCell = document.createElement('div');
      locCell.className = 'text-xs text-slate-500 py-2 px-1 truncate flex items-center';
      locCell.title = item.location || '';
      locCell.textContent = item.location || '—';
      row.appendChild(locCell);

      // Condition
      const condCell = document.createElement('div');
      condCell.className = 'text-xs text-slate-500 py-2 px-1 truncate flex items-center';
      condCell.textContent = item.condition || '—';
      row.appendChild(condCell);

      // Owner
      const ownerCell = document.createElement('div');
      ownerCell.className = 'text-xs text-slate-500 py-2 px-1 truncate flex items-center';
      ownerCell.title = item.owner || '';
      ownerCell.textContent = item.owner || '—';
      row.appendChild(ownerCell);

      // Status dot
      const statusCell = document.createElement('div');
      statusCell.className = 'flex items-center justify-center py-2';
      statusCell.innerHTML = `<span class="w-2 h-2 rounded-full ${dotColor(item.status)}" title="${item.status}"></span>`;
      row.appendChild(statusCell);

      // Day cells
      days.forEach(d => {
        const iso = toIso(d);
        const dayEvents = eventsForDay(iso).filter(e => e.item === item.name);
        const ev = dayEvents[0];

        const cell = document.createElement('div');
        cell.className = [
          'rounded border text-[10px] py-1 px-0.5 text-center cursor-default flex flex-col items-center justify-center min-h-[2.5rem]',
          ev ? cellClass(ev.status) : 'bg-white border-slate-200 text-slate-400',
        ].join(' ');

        if (ev) {
          cell.innerHTML = `<span class="font-medium truncate w-full leading-tight">${ev.label || 'Unknown'}</span><span class="text-[9px] opacity-75 leading-tight">${ev.status.replace('_', ' ')}</span>`;
          cell.title = `${item.name}: ${ev.label || 'Unknown'} (${ev.status})`;
          cell.classList.add('cursor-pointer');
          cell.addEventListener('click', () => {
            detail.className = 'mt-3 p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs text-slate-700';
            detail.innerHTML = `<p class="font-semibold text-slate-800 mb-1">${item.name} — ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}</p>` +
              dayEvents.map(e => `<p>📅 ${e.label || 'Unknown'} <span class="text-slate-400">(${e.status}) · ${e.start} → ${e.end}</span></p>`).join('');
          });
        } else {
          cell.innerHTML = '<span class="text-[9px]">—</span>';
        }

        row.appendChild(cell);
      });

      grid.appendChild(row);
    });
  }

  document.getElementById('wk-prev').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() - 7);
    render();
  });
  document.getElementById('wk-next').addEventListener('click', () => {
    weekStart.setDate(weekStart.getDate() + 7);
    render();
  });

  render();
})();
</script>

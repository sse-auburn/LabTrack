<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Reset Complete | SSELabTrack</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FFF5EE', 100: '#FFE4D1', 200: '#FFC9A3',
              300: '#FFA675', 400: '#F2854A', 500: '#F26522',
              600: '#DD550C', 700: '#B8450A', 800: '#933608', 900: '#6E2806',
            }
          },
          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="h-full bg-gradient-to-br from-[#03244D] via-[#0a2e5c] to-[#6E2806] font-sans antialiased">

<div class="min-h-full flex flex-col items-center justify-center px-4 py-12">

  <!-- Logo / Branding -->
  <div class="flex flex-col items-center mb-8">
    <div class="w-16 h-16 rounded-2xl bg-brand-600 flex items-center justify-center shadow-xl mb-4">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-extrabold text-white tracking-tight">SSELabTrack</h1>
    <p class="text-slate-400 text-sm mt-1">Smart Systems Engineering</p>
  </div>

  <!-- Card -->
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-2xl ring-1 ring-white/10 overflow-hidden">
      <div class="px-8 py-10 text-center space-y-4">
        <!-- Success icon -->
        <div class="flex justify-center">
          <div class="w-16 h-16 rounded-full bg-green-100 flex items-center justify-center">
            <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
        </div>

        <h2 class="text-xl font-bold text-slate-800">Password updated!</h2>
        <p class="text-sm text-slate-500 leading-relaxed">
          Your password has been successfully reset. You can now sign in with your new password.
        </p>

        <div class="pt-2">
          <a href="{% url 'accounts:login' %}"
             class="inline-flex items-center gap-2 px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-xl transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
            </svg>
            Sign In
          </a>
        </div>
      </div>
    </div>

    <p class="text-center text-xs text-slate-500 mt-6">
      &copy; {% now "Y" %} SSELabTrack &mdash; Smart Systems Engineering
    </p>
  </div>

</div>
</body>
</html>
